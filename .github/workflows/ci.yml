name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 24 is the supported target (see .node-version). 22.x is the
        # declared engines floor and is tested so the floor stays honest;
        # vitest 5 supports ^22.12.0 || ^24.0.0, ai 7 requires node >=22.
        node-version: [22.x, 24.x]
        # The repo is installable with npm or pnpm and both lockfiles are
        # maintained. Testing both is what catches a dependency that only
        # resolves under one of them - e.g. a package imported directly but
        # only present as a hoisted transitive dependency under npm.
        package-manager: [npm, pnpm]

    name: Node ${{ matrix.node-version }} / ${{ matrix.package-manager }}

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          # pnpm is deliberately not pinned in package.json (public repo -
          # contributors may use any pnpm >= 10). CI pins its own version.
          version: 12

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ matrix.package-manager == 'pnpm' && 'pnpm' || 'npm' }}

      - name: Install dependencies (npm)
        if: matrix.package-manager == 'npm'
        run: npm ci

      - name: Install dependencies (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ${{ matrix.package-manager }} run build

      - name: Typecheck
        run: ${{ matrix.package-manager }} run typecheck

      - name: Run tests
        run: ${{ matrix.package-manager }} test

  # Every action of every public tool, without credentials. The tool e2e
  # suites need live GitHub credentials and skip without them, so this is the
  # part of the surface CI actually exercises.
  action-sweep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Use Node.js '24.x'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Sweep every tool action
        run: pnpm run test:e2e:sweep

      - name: Action coverage gate
        run: pnpm run test:e2e:coverage

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Use Node.js '24.x'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # package-lock.json and pnpm-lock.yaml must resolve the same version of
      # every direct dependency (no network needed).
      - name: Lockfiles in sync
        run: pnpm run check:lockfiles

      # Tool/action counts quoted in README, docs and package.json must equal
      # what the ToolRegistry serves.
      - name: Doc counts match the registry
        run: pnpm run check:docs

  # The compound-tool schema snapshot (schema-snapshot unit test) runs in the
  # `test` matrix above as part of `vitest run`; no separate step is needed.

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js '24.x'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # Fails on any high or critical advisory in the resolved tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # The Dockerfile is not part of the npm package, so nothing else exercises
  # it. Build the image and check the runtime contract the docs promise:
  # non-root uid 10001, an owner-only /data volume as the OAuth token store,
  # the bin entry, and a token that persists across containers.
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t gpm-smoke:ci .

      - name: Runtime user, /data volume and version
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id gpm-smoke:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint stat gpm-smoke:ci -c '%a %U' /data)" = "700 mcpuser"
          test "$(docker run --rm gpm-smoke:ci --version)" = "$(node -p "require('./package.json').version")"

      - name: OAuth token store persists in the volume
        run: |
          set -euo pipefail
          docker volume create gpm-smoke-data
          run() { docker run --rm -v gpm-smoke-data:/data -e GITHUB_OAUTH_CLIENT_ID=Iv1.ci "$@"; }
          # Not logged in: exit 1, store under /data.
          if run gpm-smoke:ci auth status > status.txt; then exit 1; fi
          grep -q 'Store: /data/github-oauth.json' status.txt
          # A 0600 token written by mcpuser is read by a later container.
          run --entrypoint sh gpm-smoke:ci -c "umask 077; printf '%s' '{\"clientId\":\"Iv1.ci\",\"token\":\"gho_ciplaceholderciplaceholderciplace0\",\"tokenType\":\"bearer\",\"scopes\":[\"repo\"],\"login\":\"ci-user\",\"createdAt\":\"2026-01-01T00:00:00.000Z\"}' > /data/github-oauth.json"
          run gpm-smoke:ci auth status | tee status.txt
          grep -q 'Status: logged in' status.txt
          grep -q 'Permissions: ok (owner-only)' status.txt
          # logout always deletes the local file.
          run gpm-smoke:ci auth logout
          test "$(run --entrypoint sh gpm-smoke:ci -c 'ls -A /data | wc -l')" = "0"
