name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js '24.x'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.version_type }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG
        run: |
          VERSION="${{ steps.bump.outputs.VERSION }}"
          DATE=$(date +%Y-%m-%d)
          # Move the [Unreleased] body into the new version section and reset
          # [Unreleased] to the placeholder. The release workflow extracts the
          # version section verbatim, so it must be the real content.
          node -e '
          const fs = require("fs");
          const [version, date] = process.argv.slice(1);
          const file = "CHANGELOG.md";
          const content = fs.readFileSync(file, "utf8");
          const re = /^## \[Unreleased\]\n\n([\s\S]*?)(?=^## \[)/m;
          const match = content.match(re);
          if (!match) {
            console.error("CHANGELOG.md has no [Unreleased] section");
            process.exit(1);
          }
          const body = match[1].trim();
          const section = `## [${version}] - ${date}\n\n${body}\n\n`;
          fs.writeFileSync(
            file,
            content.replace(re, `## [Unreleased]\n\nNo unreleased changes.\n\n${section}`)
          );
          ' "$VERSION" "$DATE"

      - name: Commit and tag
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: v$VERSION"
          git tag "v$VERSION"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ steps.bump.outputs.VERSION }}"

      # A tag pushed with GITHUB_TOKEN does not trigger release.yml (GitHub
      # suppresses workflow runs caused by GITHUB_TOKEN events, except
      # workflow_dispatch), so the release is dispatched on the new tag.
      - name: Start the release
        run: gh workflow run release.yml --ref "v${{ steps.bump.outputs.VERSION }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release v${{ steps.bump.outputs.VERSION }} tagged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "release.yml was dispatched on the tag. It will:" >> $GITHUB_STEP_SUMMARY
          echo "1. Build, typecheck and test" >> $GITHUB_STEP_SUMMARY
          echo "2. Publish to npm (Trusted Publishing)" >> $GITHUB_STEP_SUMMARY
          echo "3. Create the GitHub release from the CHANGELOG section" >> $GITHUB_STEP_SUMMARY
