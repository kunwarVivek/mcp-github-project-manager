# pnpm 12 build-script allowlist.
#
# pnpm 12 refuses to install (ERR_PNPM_IGNORED_BUILDS) when a dependency has a
# lifecycle script that has not been explicitly approved. esbuild ships a
# postinstall that links/validates its platform binary, and both vitest and
# tsx depend on it, so it must be allowed or the test/dev toolchain breaks.
#
# Keys are package names, values are booleans. Prefix a name with "!" to deny.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.84'
  - '@ai-sdk/gateway@4.0.119'
  - '@ai-sdk/google@4.0.101'
  - '@ai-sdk/openai@4.0.98'
  - '@ai-sdk/perplexity@5.0.16'
  - '@ai-sdk/provider-utils@5.0.64'
  - '@ai-sdk/provider@4.0.31'
  - ai@7.0.146
  - nock@15.0.4
